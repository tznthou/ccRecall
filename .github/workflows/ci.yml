name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu covers the Node engine range (22/24), both LTS lines that still
        # get security fixes. Node 20 left with its end-of-life on 2026-04-30.
        # macOS adds coverage for the darwin-only install-daemon / plist paths;
        # ubuntu skips those via `if (process.platform !== 'darwin') return`
        # inside the tests. It runs 24, the version in .node-version.
        # Keep only one macOS leg to limit spend — macos runners bill ~10x.
        # Ubuntu is pinned to 24.04, not ubuntu-latest, so a runner image
        # switch arrives as a reviewed change instead of a red build that no
        # code change caused.
        include:
          - os: ubuntu-24.04
            node: '22'
          - os: ubuntu-24.04
            node: '24'
          - os: macos-latest
            node: '24'
    name: ${{ matrix.os }} / Node ${{ matrix.node }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # build runs tsc (typecheck) + chmod. dist/ is required by
      # tests/bin-smoke.test.ts, so this must precede vitest.
      - run: pnpm build

      # Skip the --fix variant from package.json; CI must not silently
      # modify source. Fail on any lint error instead.
      - run: pnpm exec eslint .

      # The #99 regression tests run the wrapper's deletion lines in a real
      # interactive zsh and skip when it is absent. macOS ships zsh;
      # ubuntu-24.04 does not, and without this step the Linux legs report
      # green while silently skipping that suite.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - run: pnpm vitest run
