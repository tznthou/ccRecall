name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag or SHA) to publish'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # id-token: write lets this job mint an OIDC token that npm exchanges
    # for a short-lived publish credential via Trusted Publishing. No long-
    # lived NPM_TOKEN is stored or needed. contents: write lets the trailing
    # `gh release create` step land a release on the repo.
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10

      # Build and test on a version inside the package's engines range
      # (>=20 <23), matching ci.yml. The publish step needs a newer Node for
      # OIDC and switches to it further down — an earlier revision of this
      # file ran the whole job on 24, and its comment claimed that "only
      # affects the publish step", which was never true: vitest ran there
      # too. On 24 the run dies before reporting any test result —
      # better-sqlite3's cleanup hook fires against a torn-down environment
      # as tinypool recycles workers (node::RemoveEnvironmentCleanupHook,
      # hooks.cc:142, "Assertion failed: (env) != nullptr"), taking the
      # worker with it. Reproduced on two consecutive runs of v0.7.2.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # The #99 regression tests need a real zsh (see ci.yml) and this job
      # gates the npm publish — a silent skip here would ship on less than
      # the full suite. ubuntu-latest does not preinstall zsh.
      - run: sudo apt-get update && sudo apt-get install -y zsh

      # Full test suite must pass before anything reaches npm.
      - run: pnpm vitest run

      # Everything below this line runs on Node 24, which ships npm >= 11.5.1
      # — required for the current OIDC handshake. On Node 22 / npm 10 the
      # exchange silently falls back to anonymous and npm answers the PUT
      # with a misleading 404. Nothing after this point loads a native addon:
      # the version check is plain JS plus `npm view`, and `pnpm publish`
      # only copies the paths listed in package.json's `files` field (dist,
      # hooks, scripts, both READMEs, LICENSE) into a tarball, with no
      # prepublishOnly / prepack / prepare hook to run — so the
      # better-sqlite3 binding compiled against Node 22 above is never
      # opened and needs no rebuild.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Idempotency guard for tag re-pushes (e.g. converting a lightweight
      # tag to an annotated one). Without this, a re-trigger dies with
      # "cannot publish over previously published versions: X" — harmless
      # but cosmetically red on the Actions list.
      - name: Check if version already published
        id: npm_check
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "Version $PKG_VERSION already on npm — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # --access public: scoped packages (@tznthou/*) default to private;
      #   first publish must opt in explicitly.
      # --no-git-checks: pnpm otherwise refuses to publish from a CI
      #   detached-HEAD checkout.
      # --provenance: attach a SLSA provenance attestation derived from
      #   the OIDC token. Triggers the Trusted Publishing path on npm —
      #   requires a matching trusted-publisher rule on the package.
      - name: Publish to npm
        if: steps.npm_check.outputs.skip != 'true'
        run: pnpm publish --access public --no-git-checks --provenance

      # Auto-create the GitHub Release on tag push so it never gets missed
      # (v0.1.4 was published to npm but the Release was forgotten for hours).
      # Published directly with auto-generated notes (derived from commit / PR
      # history) and marked --latest. This previously created a DRAFT for a
      # human to polish and promote, but the drafts sat un-promoted for weeks
      # (v0.4.2–v0.4.5), leaving the repo's "Latest" badge stuck on an old
      # version while npm moved on — so it now publishes straight away; polish
      # the notes after the fact if needed. Only fires on tag pushes;
      # workflow_dispatch reruns skip this step to avoid "release already
      # exists" errors on re-publishes.
      - name: Create GitHub Release
        # event_name == 'push' guard: github.ref can be a tag ref under
        # workflow_dispatch too (gh workflow run --ref v1.2.3), which would
        # otherwise publish a non-draft Latest release on a manual rerun.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists — skipping create."
          else
            gh release create "${{ github.ref_name }}" --verify-tag --generate-notes --latest --title "${{ github.ref_name }}"
          fi
